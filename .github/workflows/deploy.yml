name: Deploy to GitHub Pages

# Publishes the site.
#
# REQUIRES ONE SETTING, ONCE: Settings -> Pages -> Source -> "GitHub Actions".
# This cannot be automated: creating a Pages site needs admin rights, and the
# built-in GITHUB_TOKEN cannot be granted them (`enablement: true` fails with
# "Resource not accessible by integration"). After that one change this
# workflow deploys on every push with no further clicks.
on:
  push:
    branches: ['claude/promotion-test-prep-app-koldll']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site must never ship the key or any plaintext. This is the same
      # check the verify workflow runs; repeated here so a deploy cannot
      # publish something a skipped check would have caught.
      - name: Check nothing secret is being published
        run: node tools/check-leaks.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest robots.txt .nojekyll \
                css js data _site/
          echo "Publishing:"
          find _site -type f | sort

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Explain a Pages misconfiguration
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not configured for this repository."
          echo "::error::Fix: Settings -> Pages -> Source -> 'GitHub Actions', then re-run this workflow."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
